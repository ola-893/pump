[package]
name = "pumpcoin-demo-clearing"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = [".", "test-token", "agent-vault", "vault-factory"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.17.2", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "=5.17.2", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
